name: Deploy TorNest website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'app/src/main/res/mipmap-xxxhdpi/ic_launcher.png'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'app/src/main/res/mipmap-xxxhdpi/ic_launcher.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static website
        env:
          # The repository Actions variable can override the site's GA4 web stream.
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || 'G-3XDG3KCXP6' }}
        run: node website/build.mjs
      - name: Check pages and local links
        run: node website/check.mjs
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
